workflows:
  android-release:
    name: Android Release

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate Drift files
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Get signaling server packages
        script: |
          cd signaling_server
          dart pub get
          cd ..

      - name: Analyze Flutter app
        script: |
          flutter analyze lib test

      - name: Analyze signaling server
        script: |
          cd signaling_server
          dart analyze
          cd ..

      - name: Run Flutter tests
        script: |
          flutter test

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk