name: two_person_app
description: >
  A private digital space shared between exactly two people.
  Pure peer-to-peer, end-to-end encrypted, no servers.

publish_to: 'none'

version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  sqlite3: ^2.4.7

  # State management
  flutter_riverpod: ^2.5.1

  # Dependency Injection
  get_it: ^7.7.0

  # Database
  drift: ^2.17.0
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.3
  path: ^1.9.0

  # WebRTC
  flutter_webrtc: ^1.2.0

  # Cryptography
  cryptography: ^2.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # QR Pairing
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Signaling
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  app_links: ^6.3.2

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.4.2

    # Media Sharing
  image_picker: ^1.1.2
  file_picker: ^10.3.2
  permission_handler: ^12.0.1
  record: ^6.1.2
  open_filex: ^4.7.0
  video_player: ^2.10.0
  audioplayers: ^6.5.0

  # REQUIRED
  mime: ^2.0.0
  flutter_image_compress: ^2.3.0
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.17.0

flutter:
  uses-material-design: true